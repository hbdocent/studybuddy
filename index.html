<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StudyBuddy</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0f172a" />
<style>
:root{--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;font-family:'Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
input,select,button{font-size:16px} /* voorkom zoom-in op telefoon */
body{background:linear-gradient(160deg,#0f172a,#16233d);color:var(--text);min-height:100vh}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#1e293bee;position:sticky;top:0;z-index:10;border-bottom:1px solid #334155}
.logo{font-weight:800;display:flex;align-items:center;gap:8px}
.dot{width:28px;height:28px;border-radius:50%;background:#2f7df6;display:inline-flex;align-items:center;justify-content:center}
.lang{background:#26334a;color:var(--text);border:1px solid #334155;border-radius:999px;padding:7px 12px}
.wrap{max-width:1000px;margin:0 auto;padding:18px}
.hero{background:linear-gradient(120deg,#0d9488,#2f7df6);border-radius:20px;padding:20px;margin-bottom:16px;display:flex;gap:16px;align-items:center}
.avatar{width:60px;height:60px;border-radius:50%;background:#fff3;display:flex;align-items:center;justify-content:center;font-size:2rem}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:10px 18px;border-radius:999px;background:var(--card);border:1px solid #334155;color:var(--text);cursor:pointer;font-weight:600}
.tab.active{background:#2f7df6;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px}
.card{background:var(--card);border-radius:16px;padding:16px;border:1px solid #ffffff14}
.login-card{max-width:420px;margin:40px auto}
h1{font-size:1.2rem;margin-bottom:10px}
h3{font-size:1.02rem;margin-bottom:6px}
input,select{width:100%;max-width:100%;background:#0f172a;border:1px solid #334155;color:var(--text);border-radius:10px;padding:11px;margin:8px 0;font-size:16px;height:44px;appearance:none;-webkit-appearance:none}
input[type="date"]{min-height:44px}
select{background-image:none;cursor:pointer}
select option{background:#1e293b;color:var(--text)}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1)}
.muted{color:var(--muted);font-size:.9rem;margin-bottom:8px;line-height:1.4}
.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;margin:4px 6px 4px 0;font-size:.9rem}
.primary{background:linear-gradient(90deg,#22c55e,#2f7df6);color:#fff}
.ghost{background:#ffffff14;color:var(--text)}
.tag{display:inline-block;font-size:.72rem;padding:3px 10px;border-radius:999px;font-weight:700;margin-bottom:6px}
.late{background:#ef444433;color:#fca5a5}.soon{background:#f59e0b33;color:#fbbf24}.ok{background:#22c55e33;color:#4ade80}
.progress{height:8px;background:#ffffff18;border-radius:99px;overflow:hidden;margin:8px 0}
.progress>div{height:100%;background:#22c55e;border-radius:99px}
.today-banner{background:linear-gradient(90deg,#22c55e22,#2f7df622);border:1px dashed #22c55e;border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:.95rem}
.today-banner b{color:#4ade80}
.group-head{grid-column:1/-1;margin:18px 0 2px;padding-bottom:4px;border-bottom:1px solid #334155;color:var(--muted);font-size:.95rem}
@media(max-width:560px){
  .wrap{padding:14px}
  .bar{padding:10px 14px}
  .hero{padding:14px;flex-direction:column;text-align:center}
  .hero .avatar{width:52px;height:52px;font-size:1.6rem}
  .hero h1{font-size:1.1rem}
  .tabs{justify-content:center}
  .tab{padding:10px 14px;font-size:.9rem}
  .btn{padding:12px 14px;font-size:16px} /* tikdoelen groot genoeg */
  .grid{grid-template-columns:1fr;gap:12px}
  .card{padding:14px}
}
[dir=rtl] .wrap{direction:rtl}
</style>
</head>
<body>
<div class="bar">
  <div class="logo"><span class="dot">📅</span><span>StudyBuddy</span></div>
  <select id="langSel" onchange="app.setLang(this.value)" aria-label="Taal">
    <option value="nl">🇳🇱 NL</option><option value="en">🇬🇧 EN</option>
    <option value="ar">🇸🇦 AR</option><option value="so">🇸🇴 SO</option>
    <option value="tr">🇹🇷 TR</option><option value="uk">🇺🇦 UK</option>
    <option value="pl">🇵🇱 PL</option>
  </select>
</div>
<div class="wrap">

<div id="loginTpl" hidden>
  <div class="card login-card">
    <h1 id="t-login"></h1>
    <p class="muted" id="t-privacy"></p>
    <input id="in-user" autocomplete="off" />
    <label id="t-username" for="in-user" class="muted"></label>
    <input id="in-code" type="password" autocomplete="off" />
    <label id="t-code" for="in-code" class="muted"></label>
    <p class="muted" id="err" style="color:#ef4444"></p>
    <button class="btn primary" id="btn-login"></button>
  </div>
</div>

<div id="appTpl" hidden>
  <div class="hero"><div class="avatar">😎</div><div><h1 id="t-welcome"></h1></div></div>
  <div class="today-banner" id="todayBanner" hidden></div>
  <div class="tabs">
    <button class="tab active" data-tab="today" onclick="app.tab('today')"></button>
    <button class="tab" data-tab="week" onclick="app.tab('week')"></button>
  </div>
  <button class="btn primary" onclick="app.showAdd()" id="t-addTask"></button>
  <button class="btn ghost" onclick="app.enablePush()" id="t-notifOn"></button>
  <button class="btn ghost" onclick="app.logout()" id="t-logout"></button>
  <div class="card" id="addForm" hidden>
    <select id="f-category" onchange="app.fillSubjects()"></select>
    <select id="f-subject"></select>
    <input id="f-title" placeholder="Opdracht" />
    <input id="f-deadline" type="date" />
    <button class="btn primary" onclick="app.addTask()" id="t-save"></button>
  </div>
  <div class="grid" id="taskGrid"></div>
</div>

</div>
<script type="module">

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* Vakken per categorie — pas deze lijsten gerust aan */
const CATEGORIES = {
  "📚 Theorievakken": [

    "⚡ Natuurkunde", "🌍 Maatschappijkunde", "💰 Economie", "🇩🇪 Duits"
  ],
  "💼 Praktijkvakken E&O": [

  ],

  ],
  "🎬 Praktijkvakken MVI": [
    "🎥 Audio-visueel", "🖼️ 2D3D", "✨ Interactieve vormgeving", "💻 ICT"
  ],
  "✅ Verplichte lessen": [
    "🏛️ Maatschappijleer", "💪 LO", "🎨 CKV", "🧑‍🎨 Montessori Atelier"
  ],
  "⭐ Keuzevakken": [
    "🧊 3D-ontwerp", "🎬 Animatie tekenen en Character Design", "🍽️ Bijzondere keuken",
    "🔬 MLab", "👗 Mode & Design", "⚽ Ondersteuning Sport- en bewegingsactiviteiten",
    "💅 Uiterlijke verzorging", "🛒 Webshop"
  ]
};

const I18N = {
  nl: { dir:"ltr", login:"Inloggen of nieuw account", username:"Kies een gebruikersnaam (geen echte naam!)", code:"Kies een geheime code (min. 6 tekens)", loginBtn:"Ga verder", today:"Vandaag", week:"Week", addTask:"Nieuwe taak", save:"Opslaan", done:"Klaar", delete:"Verwijderen", logout:"Uitloggen", reminder:"⏰ Nog {n} taken voor vandaag!", welcome:"Hoi {u}! 👋", privacy:"🔒 Geen tracking, geen advertenties, data in Europa. Verwijderen = echt weg.", notifOn:"🔔 Meldingen", pickSubject:"Kies een categorie…", pickVak:"Kies een vak…", banner1:"☀️ Goedemorgen! Vandaag moet je <b>{n}</b> ding(en) inleveren:", bannerNone:"☀️ Goedemorgen! Niks te doen vandaag — lekker!" },
  en: { dir:"ltr", login:"Log in or create account", username:"Choose a username (not your real name!)", code:"Choose a secret code (min. 6 characters)", loginBtn:"Continue", today:"Today", week:"Week", addTask:"New task", save:"Save", done:"Done", delete:"Delete", logout:"Log out", reminder:"⏰ {n} tasks left today!", welcome:"Hi {u}! 👋", privacy:"🔒 No tracking, no ads, data in Europe. Delete means gone.", notifOn:"🔔 Notifications", pickSubject:"Choose a category…", pickVak:"Choose a subject…", banner1:"☀️ Good morning! You have <b>{n}</b> thing(s) to hand in today:", bannerNone:"☀️ Good morning! Nothing due today — enjoy!" },
  ar: { dir:"rtl", login:"تسجيل الدخول أو حساب جديد", username:"اختر اسم مستخدم (ليس اسمك الحقيقي!)", code:"اختر رمزاً سرياً (6 أحرف على الأقل)", loginBtn:"متابعة", today:"اليوم", week:"الأسبوع", addTask:"مهمة جديدة", save:"حفظ", done:"تم", delete:"حذف", logout:"خروج", reminder:"⏰ بقيت {n} مهام اليوم!", welcome:"مرحباً {u}! 👋", privacy:"🔒 لا تتبع، لا إعلانات، البيانات في أوروبا.", notifOn:"🔔 الإشعارات", pickSubject:"اختر فئة…", pickVak:"اختر مادة…", banner1:"☀️ صباح الخير! لديك <b>{n}</b> مهمة اليوم:", bannerNone:"☀️ صباح الخير! لا شيء لليوم — استمتع!" },
  so: { dir:"ltr", login:"Gal ama akoon cusub", username:"Dooro magac isticmaale (HA digin magacaaga runta ah!)", code:"Dooroo koodh sir ah (ugu yaraan 6)", loginBtn:"Sii wad", today:"Maanta", week:"Toddobaad", addTask:"Hawl cusub", save:"Kaydi", done:"La sameeyay", delete:"Tirtir", logout:"Ka bax", reminder:"⏰ waxaa ka hadhay {n} hawl maanta!", welcome:"Salaan {u}! 👋", privacy:"🔒 Wax raadin ah, wax xayeysiis ah; xogta Yurub.", notifOn:"🔔 Ogeysiisyo", pickSubject:"Dooro qayb…", pickVak:"Dooro xeer…", banner1:"☀️ Subax wanaagsan! Waxaad haysataa <b>{n}</b> hawl maanta:", bannerNone:"☀️ Subax wanaagsan! Wax maanta — ku raaxayso!" },
  tr: { dir:"ltr", login:"Giriş yap veya hesap oluştur", username:"Bir kullanıcı adı seç (gerçek adın değil!)", code:"Gizli bir kod seç (en az 6 karakter)", loginBtn:"Devam", today:"Bugün", week:"Hafta", addTask:"Yeni görev", save:"Kaydet", done:"Hazır", delete:"Sil", logout:"Çıkış", reminder:"⏰ bugün {n} görev kaldı!", welcome:"Merhaba {u}! 👋", privacy:"🔒 Takip yok, reklam yok; veriler Avrupa'da.", notifOn:"🔔 Bildirimler", pickSubject:"Kategori seç…", pickVak:"Ders seç…", banner1:"☀️ Günaydın! Bugün <b>{n}</b> teslim edecek şeyin var:", bannerNone:"☀️ Günaydın! Bugün teslim yok — iyi eğlenceler!" },
  uk: { dir:"ltr", login:"Увійти або створити акаунт", username:"Вибери ім'я користувача (не справжнє!)", code:"Вибери секретний код (мін. 6 символів)", loginBtn:"Продовжити", today:"Сьогодні", week:"Тиждень", addTask:"Нова задача", save:"Зберегти", done:"Готово", delete:"Видалити", logout:"Вийти", reminder:"⏰ залишилось {n} завдань сьогодні!", welcome:"Привіт, {u}! 👋", privacy:"🔒 Без стеження і реклами; дані в ЄС.", notifOn:"🔔 Сповіщення", pickSubject:"Вибери категорію…", pickVak:"Вибери предмет…", banner1:"☀️ Доброго ранку! Сьогодні треба здати <b>{n}</b>: ", bannerNone:"☀️ Доброго ранку! На сьогодні нічого — відпочивай!" },
  pl: { dir:"ltr", login:"Zaloguj się lub utwórz konto", username:"Wybierz nazwę użytkownika (nie prawdziwe imię!)", code:"Wybierz tajny kod (min. 6 znaków)", loginBtn:"Dalej", today:"Dziś", week:"Tydzień", addTask:"Nowe zadanie", save:"Zapisz", done:"Gotowe", delete:"Usuń", logout:"Wyloguj", reminder:"⏰ zostało dziś {n} zadań!", welcome:"Cześć, {u}! 👋", privacy:"🔒 Bez śledzenia i reklam; dane w UE.", notifOn:"🔔 Powiadomienia", pickSubject:"Wybierz kategorię…", pickVak:"Wybierz przedmiot…", banner1:"☀️ Dzień dobry! Masz dziś <b>{n}</b> do oddania:", bannerNone:"☀️ Dzień dobry! Dziś nic do oddania — miłego dnia!" }
};

window.app = {
  lang: localStorage.getItem("sb_lang") || "nl",
  user: null,
  tasks: [],

  t(key, vars) {
    let s = (I18N[this.lang] && I18N[this.lang][key]) || I18N.nl[key] || key;
    if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
    return s;
  },

  setLang(l) {
    this.lang = l; localStorage.setItem("sb_lang", l);
    document.documentElement.lang = l; document.documentElement.dir = I18N[l].dir;
    this.render(); this.listTasks();
  },

  async login() {
    const user = document.getElementById("in-user").value.trim();
    const code = document.getElementById("in-code").value;
    const err = document.getElementById("err");
    err.textContent = "";
    if (!user || code.length < 6) { err.textContent = "✗ gebruikersnaam + code van min. 6 tekens"; return; }
    const { data: auth, error: e1 } = await sb.auth.signInAnonymously();
    if (e1) { err.textContent = e1.message; return; }
    const { error: e2 } = await sb.from("profiles").upsert({
      id: auth.user.id, username: user, recovery_code: btoa(code), lang: this.lang
    });
    if (e2) { err.textContent = e2.message; return; }
    location.reload();
  },

  async logout() { await sb.auth.signOut(); location.reload(); },

  tab(t) {
    document.querySelectorAll(".tab").forEach(el => el.classList.toggle("active", el.dataset.tab === t));
    this.render();
  },

  showAdd() { document.getElementById("addForm").hidden = false; },

  async addTask() {
    const subject = document.getElementById("f-subject").value;
    const title = document.getElementById("f-title").value.trim();
    const deadline = document.getElementById("f-deadline").value || null;
    if (!subject || !title) return;
    const { error } = await sb.from("tasks").insert({ user_id: this.user.id, subject, title, deadline });
    if (!error) {
      document.getElementById("addForm").hidden = true;
      document.getElementById("f-title").value = "";
      document.getElementById("f-deadline").value = "";
      this.listTasks();
    }
  },

  async toggle(id, done) { await sb.from("tasks").update({ done: !done }).eq("id", id); this.listTasks(); },
  async del(id) { await sb.from("tasks").delete().eq("id", id); this.listTasks(); },

  async listTasks() {
    const { data } = await sb.from("tasks").select("*").order("deadline", { ascending: true, nullsFirst: false });
    this.tasks = data || [];
    this.render();
    this.checkReminders();
  },

  render() {
    const today = new Date().toISOString().slice(0, 10);
    const activeTab = document.querySelector(".tab.active").dataset.tab;
    const grid = document.getElementById("taskGrid"); grid.innerHTML = "";

    /* Ochtend-banner: taken die vandaag moeten */
    const todayTasks = this.tasks.filter(tk => tk.deadline === today && !tk.done);
    const banner = document.getElementById("todayBanner");
    if (todayTasks.length) {
      banner.hidden = false;
      banner.innerHTML = this.t("banner1", { n: todayTasks.length }) + " " +
        todayTasks.map(tk => "📌 " + tk.subject.split(" ")[0] + " " + tk.title).join(" · ");
    } else if (this.tasks.some(tk => tk.deadline === today)) {
      banner.hidden = false; banner.innerHTML = this.t("bannerNone");
    } else {
      banner.hidden = true;
    }

    const makeCard = (task) => {
      const late = task.deadline && task.deadline < today && !task.done;
      const soon = task.deadline && task.deadline >= today && task.deadline <= new Date(Date.now() + 2 * 864e5).toISOString().slice(0, 10);
      const cls = task.done ? "ok" : late ? "late" : soon ? "soon" : "ok";
      const emoji = task.done ? "✅" : late ? "⚠️" : soon ? "⏰" : "📅";
      const card = document.createElement("div"); card.className = "card";
      card.innerHTML = "<h3>" + task.subject + " – " + task.title + "</h3>" +
        '<span class="tag ' + cls + '">' + emoji + " " + (task.deadline || "") + "</span>" +
        '<div class="progress"><div style="width:' + (task.done ? 100 : 40) + '%"></div></div>' +
        '<button class="btn primary" onclick="app.toggle(' + task.id + "," + task.done + ')">' + this.t("done") + "</button>" +
        '<button class="btn ghost" onclick="app.del(' + task.id + ')">' + this.t("delete") + "</button>";
      return card;
    };

    if (activeTab === "today") {
      this.tasks.forEach(task => {
        if (!(task.deadline === today || (task.deadline && task.deadline < today && !task.done))) return;
        grid.appendChild(makeCard(task));
      });
    } else {
      /* Week-weergave: gegroepeerd per categorie */
      Object.keys(CATEGORIES).forEach(cat => {
        const list = this.tasks.filter(tk => CATEGORIES[cat].includes(tk.subject));
        if (!list.length) return;
        const head = document.createElement("h3");
        head.className = "group-head";
        head.textContent = cat;
        grid.appendChild(head);
        list.forEach(task => grid.appendChild(makeCard(task)));
      });
      /* Taken met een vak dat niet (meer) in een categorie staat */
      const rest = this.tasks.filter(tk => !Object.values(CATEGORIES).some(l => l.includes(tk.subject)));
      if (rest.length) {
        const head = document.createElement("h3");
        head.className = "group-head"; head.textContent = "➕ Overig";
        grid.appendChild(head);
        rest.forEach(task => grid.appendChild(makeCard(task)));
      }
    }

    document.getElementById("langSel").value = this.lang;
    document.getElementById("t-addTask").textContent = "+ " + this.t("addTask");
    document.getElementById("t-save").textContent = this.t("save");
    document.getElementById("t-logout").textContent = this.t("logout");
    document.getElementById("t-notifOn").textContent = this.t("notifOn");
    document.querySelector('[data-tab="today"]').textContent = this.t("today");
    document.querySelector('[data-tab="week"]').textContent = this.t("week");

    /* Categorie- en vak-dropdowns vullen */
    const catSel = document.getElementById("f-category");
    if (catSel && !catSel.options.length) {
      catSel.innerHTML = '<option value="">' + this.t("pickSubject") + "</option>" +
        Object.keys(CATEGORIES).map(c => '<option value="' + c + '">' + c + "</option>").join("");
    }
    if (!catSel.dataset.filled) { this.fillSubjects(); catSel.dataset.filled = "1"; }
    const d = document.getElementById("f-deadline");
    if (d) d.min = today;
  },

  /* Vakken-dropdown vullen op basis van gekozen categorie */
  fillSubjects() {
    const catSel = document.getElementById("f-category");
    const sel = document.getElementById("f-subject");
    if (!sel) return;
    const cat = catSel ? catSel.value : "";
    const list = CATEGORIES[cat] || [];
    sel.innerHTML = '<option value="">' + this.t("pickVak") + "</option>" +
      list.map(s => '<option value="' + s + '">' + s + "</option>").join("");
  },

  /* 08:00-melding op de dag zelf (en herinnering voor taken die vandaag te laat zijn) */
  checkReminders() {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const today = new Date().toISOString().slice(0, 10);
    const dueToday = this.tasks.filter(tk => tk.deadline === today && !tk.done);
    const late = this.tasks.filter(tk => tk.deadline && tk.deadline < today && !tk.done);
    if (!dueToday.length && !late.length) return;
    const key = "sb_notif_" + today;
    if (localStorage.getItem(key)) return; // vandaag al gesignaleerd
    localStorage.setItem(key, "1");
    let body = this.t("reminder", { n: dueToday.length });
    if (late.length) body = "⚠️ Te laat: " + late.map(tk => tk.subject.split(" ")[0] + " " + tk.title).join(", ") + (dueToday.length ? " | " + body : "");
    new Notification("StudyBuddy ☀️", { body });
  },

  async enablePush() {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") return;
    alert("Meldingen staan aan! Je krijgt een seintje zodra je de app opent en er nog iets te doen is.");
  },

  async loginRender() {
    document.getElementById("t-login").textContent = this.t("login");
    document.getElementById("t-privacy").textContent = this.t("privacy");
    document.getElementById("t-username").textContent = this.t("username");
    document.getElementById("t-code").textContent = this.t("code");
    document.getElementById("btn-login").textContent = this.t("loginBtn");
    document.getElementById("btn-login").onclick = () => this.login();
  }
};

(async () => {
  try {
    app.setLang(app.lang);
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      app.user = session.user;
      document.getElementById("loginTpl").hidden = true;
      document.getElementById("appTpl").hidden = false;
      const { data: prof } = await sb.from("profiles").select("username").eq("id", session.user.id).single();
      document.getElementById("t-welcome").textContent = app.t("welcome", { u: (prof && prof.username) || "" });
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
      app.listTasks();
    } else {
      document.getElementById("loginTpl").hidden = false;
      app.loginRender();
    }
  } catch (e) {
    /* Fallback: laat in ieder geval het inlogscherm zien */
    document.getElementById("loginTpl").hidden = false;
    document.getElementById("t-login").textContent = "Inloggen of nieuw account";
    document.getElementById("t-privacy").textContent = "🔒 Geen tracking, geen advertenties, data in Europa.";
    document.getElementById("t-username").textContent = "Kies een gebruikersnaam (geen echte naam!)";
    document.getElementById("t-code").textContent = "Kies een geheime code (min. 6 tekens)";
    document.getElementById("btn-login").textContent = "Ga verder";
    document.getElementById("err").textContent = "⚠️ Geen verbinding met de database — check je internet.";
  }
})();
</script>
</body>
</html>
